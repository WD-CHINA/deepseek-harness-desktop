name: Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  package:
    name: Package ${{ matrix.label }} unsigned
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Build unsigned macOS DMG and ZIP
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never \
            -c.mac.identity=null \
            -c.mac.notarize=false \
            -c.mac.hardenedRuntime=false \
            '-c.artifactName=${productName}-${version}-${os}-${arch}-unsigned.${ext}'

      - name: Build unsigned Windows NSIS installer
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          npx electron-builder --win nsis --${{ matrix.arch }} --publish never `
            -c.forceCodeSigning=false `
            '-c.artifactName=${productName}-${version}-${os}-${arch}-unsigned.${ext}'

      - name: Smoke test Windows lifecycle
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./.github/scripts/smoke-windows.ps1

      - name: Upload unsigned macOS packages
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          path: |
            release/*-unsigned.dmg
            release/*-unsigned.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload unsigned Windows installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          path: release/*-unsigned.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
