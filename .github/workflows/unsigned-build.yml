name: Unsigned Build

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: v0.0.1

concurrency:
  group: unsigned-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  package:
    name: Package ${{ matrix.label }} unsigned
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Build unsigned macOS DMG and ZIP
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never \
            --config.mac.identity=- \
            --config.mac.notarize=false \
            --config.mac.hardenedRuntime=false \
            '--config.artifactName=${productName}-${version}-${os}-${arch}-unsigned.${ext}'

      - name: Verify ad-hoc macOS signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app_path="$(find release -maxdepth 2 -type d -name 'DeepSeek Harness Desktop.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Build unsigned Windows NSIS installer
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          npx electron-builder --win nsis --${{ matrix.arch }} --publish never `
            --config.forceCodeSigning=false `
            '--config.artifactName=${productName}-${version}-${os}-${arch}-unsigned.${ext}'

      - name: Smoke test Windows lifecycle
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./.github/scripts/smoke-windows.ps1

      - name: Upload unsigned macOS packages
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          path: |
            release/*-unsigned.dmg
            release/*-unsigned.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload unsigned Windows installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          path: release/*-unsigned.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish v0.0.1 unsigned test release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned packages
        uses: actions/download-artifact@v8
        with:
          pattern: deepseek-harness-desktop-*-unsigned
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          > [!WARNING]
          > 这是未签名测试版本，仅用于可信环境中的功能验证。

          macOS 应用使用不含开发者身份的 ad-hoc 签名，仍会显示 Gatekeeper 安全警告；
          Windows 可能显示 SmartScreen 警告。
          请只下载并运行来自本仓库 Actions 构建的文件。

          如果确认 macOS 应用来自本仓库，但系统仍提示“已损坏”，安装到 Applications 后执行：

          ```bash
          xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness Desktop.app"
          open "/Applications/DeepSeek Harness Desktop.app"
          ```
          EOF

          shopt -s nullglob
          assets=(release-assets/*-unsigned.dmg release-assets/*-unsigned.zip release-assets/*-unsigned.exe)

          if (( ${#assets[@]} == 0 )); then
            echo 'No unsigned release assets were downloaded.' >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "DeepSeek Harness Desktop $RELEASE_TAG (Unsigned Test)" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "DeepSeek Harness Desktop $RELEASE_TAG (Unsigned Test)" \
              --notes-file release-notes.md \
              --latest
          fi
