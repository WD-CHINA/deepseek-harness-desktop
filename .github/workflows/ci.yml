name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  package:
    name: Package ${{ matrix.label }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build unpacked macOS application
        if: matrix.platform == 'mac'
        run: >-
          npx electron-builder --mac --${{ matrix.arch }} --dir --publish never
          --config.mac.identity=- --config.mac.notarize=false
          --config.mac.hardenedRuntime=false
      - name: Build unpacked Windows application
        if: matrix.platform == 'win'
        run: >-
          npx electron-builder --win --${{ matrix.arch }} --dir --publish never
          --config.forceCodeSigning=false
      - name: Smoke test Windows lifecycle
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./.github/scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 7
